name: Release v0.8.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.8.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 8affc0df8e48422de31b3c48e3ca43a3ec1e9b72
    steps:
      - name: Create v0.8.0 release
        shell: bash
        run: |
          if gh release view v0.8.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.8.0 already exists"
            exit 0
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## DSH DevTools for Agents v0.8.0

          First public developer release of the Agent-oriented runtime debugging workflow for DSH / Cordis plugins.

          ### Highlights

          - Inspect live Event/listener and Fiber topology from coding Agents through MCP.
          - Attach bounded debug sessions, take runtime snapshots, and wait for filtered runtime changes.
          - Capture caller-owned checkpoints and compare semantic runtime topology after reload/reproduction.
          - Run finite, authority-gated waterfall profiling experiments with exact lease ownership.
          - Connect Codex through the profile-local stdio MCP bridge with `setup`, `doctor`, and owner-only token storage.
          - Use the same Host-owned runtime state from MCP, the JSON CLI, the debugging Skill, and the DSH Web sidebar.

          ### Install

          ```bash
          dsh plugin --profile web add github:wang-kaopu/dsh-cordis-devtools#v0.8.0
          dsh plugin --profile web exec dsh-cordis-debug setup --profile web --agent codex
          ```

          Reload DSH through your normal development workflow, then verify the connection:

          ```bash
          dsh plugin --profile web exec dsh-cordis-debug doctor --profile web
          ```

          Profile bootstrap currently requires macOS or Linux so the token file can be enforced as owner-only.
          EOF

          gh release create v0.8.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "v0.8.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
